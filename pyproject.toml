[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sjtu-canvas-assistant"
version = "0.1.0"
description = "Local CLI framework for SJTU Canvas course data, downloads, and indexing."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "SJTU Canvas Assistant" }]
license = { text = "MIT" }
dependencies = [
  "httpx[socks]>=0.27,<1.0",
  "pydantic>=2.7,<3.0",
  "python-dotenv>=1.0,<2.0",
  "rich>=13.7,<14.0",
  "typer>=0.12,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[project.scripts]
sjtu-canvas = "sjtu_canvas_assistant.cli:main"
sjtu-canvas-assistant = "sjtu_canvas_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
